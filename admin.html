<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b3a">
<title>FeiraJá | Painel de pedidos</title>
<style>
:root{color-scheme:light;--green:#176b3a;--ink:#173525;--muted:#66766c;--bg:#f3f7f1;--line:#e0e9df;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:0}h2{font-size:18px;margin:0 0 12px}.muted,.hint{color:var(--muted)}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 4px 18px #17352508}.login{max-width:460px;margin:40px auto}label{display:block;font-weight:700;margin:12px 0 6px}input,select,button{font:inherit;border-radius:10px;padding:11px 13px}input,select{border:1px solid #cddacd;background:#fff;color:var(--ink);width:100%}button{border:0;background:var(--green);color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e7f0e5;color:var(--green)}.danger{background:#fff0ed;color:#a02d20}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:white;border:1px solid var(--line);padding:16px;border-radius:14px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input{flex:1;min-width:200px}.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.orderhead{display:flex;justify-content:space-between;gap:10px;align-items:start}.order h3{font-size:17px;margin:0}.total{font-size:20px;font-weight:850;white-space:nowrap}.pill{display:inline-block;border-radius:999px;background:#fff1cf;color:#795600;font-size:12px;font-weight:750;padding:5px 9px;margin:10px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.details div{background:#f6f8f5;padding:9px;border-radius:9px;overflow-wrap:anywhere}.details small{display:block;color:var(--muted);font-size:11px}.items{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.item{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.statusrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}.statusrow label{margin:0 0 5px}.notice{padding:12px;border-radius:10px;background:#eef6eb;margin:12px 0}.error{background:#fff0ed;color:#922b20}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.orders{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:380px){.details{grid-template-columns:1fr}.statusrow{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>🥬 FeiraJá — Pedidos</h1><p class="muted">Painel privado de gestão da loja</p></div><div class="actions"><button id="refresh" class="secondary hidden">↻ Atualizar</button><button id="logout" class="secondary hidden">Sair</button></div></header>
<section id="login" class="card login"><h2>Entrar como administrador</h2><p class="muted">Use a conta de administrador da loja.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button style="width:100%;margin-top:16px">Entrar</button></form><p id="message" role="status"></p></section>
<section id="panel" class="hidden"><div id="notice" class="notice hidden" role="status"></div><div class="stats"><div class="stat"><small>Pedidos encontrados</small><strong id="count">0</strong></div><div class="stat"><small>Aguardando pagamento</small><strong id="pending">0</strong></div><div class="stat"><small>Em andamento</small><strong id="active">0</strong></div><div class="stat"><small>Vendas pagas (sem cancelados)</small><strong id="sum">R$ 0,00</strong></div></div><section class="card"><div class="filters"><input id="search" placeholder="Buscar por pedido, cliente ou telefone" aria-label="Buscar pedidos"><select id="filter" aria-label="Filtrar por status"><option value="">Todos os status</option><option>Pedido Recebido</option><option>Pagamento Pendente</option><option>Pagamento Confirmado</option><option>Preparando</option><option>Pronto para Retirada</option><option>Saiu para Entrega</option><option>Entregue</option><option>Cancelada</option></select></div></section><div id="orders" class="orders"></div><div class="actions" style="justify-content:center;margin:16px 0"><button id="loadMore" class="secondary">Carregar mais pedidos</button></div></section>
</main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const db=createClient('https://juhwdevvwstmyxyyagzh.supabase.co','sb_publishable_Hkv-6zE28sUHkhutD3TmGg_JIgOXCAW',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const statuses=['Pedido Recebido','Pagamento Pendente','Pagamento Confirmado','Preparando','Pronto para Retirada','Saiu para Entrega','Entregue','Cancelada'];
function normalizeOrderStatus(status){const s=String(status||'').trim().toLowerCase();if(['cancelada','cancelado','pagamento cancelado','pagamento recusado','pagamento reembolsado','pagamento contestado'].includes(s))return 'Cancelada';if(['entregue','concluído','concluido'].includes(s))return 'Entregue';if(['pronto para retirada','pronto'].includes(s))return 'Pronto para Retirada';if(['preparando','preparando pedido'].includes(s))return 'Preparando';if(['saiu para entrega'].includes(s))return 'Saiu para Entrega';if(['pedido recebido','recebido'].includes(s))return 'Pedido Recebido';if(['pagamento confirmado','pago'].includes(s))return 'Pagamento Confirmado';return 'Pagamento Pendente';}
let allOrders=[],seenOrderIds=new Set(),firstLoadDone=false;const PAGE_SIZE=200;
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(msg,isError=false){$('notice').textContent=msg;$('notice').classList.remove('hidden');$('notice').classList.toggle('error',isError)}
function setLoggedIn(yes){$('login').classList.toggle('hidden',yes);$('panel').classList.toggle('hidden',!yes);$('refresh').classList.toggle('hidden',!yes);$('logout').classList.toggle('hidden',!yes)}
async function show(){const{data:{session}}=await db.auth.getSession();if(!session){setLoggedIn(false);return}const{data:membership,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!membership){await db.auth.signOut();setLoggedIn(false);$('message').textContent='Esta conta não tem autorização de administrador.';return}setLoggedIn(true);await load()}
async function load(quiet=false){$('refresh').disabled=true;$('refresh').textContent='Carregando…';const{data,error}=await db.from('orders').select('id,created_at,customer_name,customer_phone,customer_address,customer_email,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist').order('created_at',{ascending:false}).limit(PAGE_SIZE);$('refresh').disabled=false;$('refresh').textContent='↻ Atualizar';if(error){notice('Não foi possível carregar os pedidos: '+error.message,true);return}const rows=data||[];if(quiet&&firstLoadDone){const fresh=rows.filter(o=>!seenOrderIds.has(o.id));if(fresh.length){notice('Novo pedido recebido: '+fresh.length+' pedido(s).');document.title='🔔 Novo pedido — FeiraJá';try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.22);}}catch{}}}allOrders=rows;seenOrderIds=new Set(rows.map(o=>o.id));firstLoadDone=true;render();if(!quiet)notice('Pedidos atualizados às '+new Date().toLocaleTimeString('pt-BR'));$('loadMore').classList.toggle('hidden',rows.length<PAGE_SIZE)}
async function loadMore(){const offset=allOrders.length;const{data,error}=await db.from('orders').select('id,created_at,customer_name,customer_phone,customer_address,customer_email,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist').order('created_at',{ascending:false}).range(offset,offset+PAGE_SIZE-1);if(error){notice('Não foi possível carregar mais pedidos: '+error.message,true);return}const seen=new Set(allOrders.map(o=>o.id));allOrders=allOrders.concat((data||[]).filter(o=>!seen.has(o.id)));render();$('loadMore').classList.toggle('hidden',(data||[]).length<PAGE_SIZE);notice('Mostrando '+allOrders.length+' pedidos.');}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=allOrders.filter(o=>(!f||normalizeOrderStatus(o.status)===f)&&(!q||[o.id,o.customer_name,o.customer_phone].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent=allOrders.length;$('pending').textContent=allOrders.filter(o=>normalizeOrderStatus(o.status)==='Pagamento Pendente').length;$('active').textContent=allOrders.filter(o=>['Pagamento Confirmado','Preparando','Pronto para Retirada','Saiu para Entrega','Entregue'].includes(normalizeOrderStatus(o.status))).length;$('sum').textContent=money(allOrders.filter(o=>['Pagamento Confirmado','Preparando','Pronto para Retirada','Saiu para Entrega','Entregue'].includes(normalizeOrderStatus(o.status))).reduce((s,o)=>s+Number(o.total||0),0));$('orders').innerHTML=filtered.map(o=>{const items=Array.isArray(o.items)?o.items:[];const checklist=o.market_checklist;const notes=Array.isArray(checklist)?'':String(checklist?.notes||'');const opts=statuses.map(s=>'<option value="'+esc(s)+'" '+(normalizeOrderStatus(o.status)===s?'selected':'')+'>'+esc(s)+'</option>').join('');return '<article class="order"><div class="orderhead"><div><h3>Pedido '+esc(o.id)+'</h3><small class="muted">'+(o.created_at?new Date(o.created_at).toLocaleString('pt-BR'):'Data indisponível')+'</small></div><div class="total">'+money(o.total)+'</div></div><span class="pill">'+esc(normalizeOrderStatus(o.status))+'</span><div class="details"><div><small>CLIENTE</small><strong>'+esc(o.customer_name)+'</strong></div><div><small>TELEFONE</small><strong>'+esc(o.customer_phone)+'</strong></div><div><small>ENTREGA</small><strong>'+esc(o.delivery_type)+'</strong></div><div><small>PAGAMENTO</small><strong>'+esc(o.payment_method)+'</strong></div><div><small>ENDEREÇO</small><strong>'+esc(o.customer_address)+'</strong></div><div><small>E-MAIL</small><strong>'+esc(o.customer_email||'Não informado')+'</strong></div></div><div class="details"><div style="grid-column:1/-1"><small>OBSERVAÇÕES DO CLIENTE</small><strong>'+esc(notes||'Nenhuma observação')+'</strong></div></div><div class="items"><strong>Itens do pedido</strong>'+ (items.length?items.map(i=>'<div class="item"><span>'+esc(i.name)+' × '+Number(i.quantity||i.qty||1)+'</span><strong>'+money(Number(i.price||0)*Number(i.quantity||i.qty||1))+'</strong></div>').join(''):'<p class="muted">Itens não detalhados</p>')+'<div class="item"><span>Subtotal</span><span>'+money(o.subtotal)+'</span></div><div class="item"><span>Frete</span><span>'+money(o.delivery_fee)+'</span></div></div><div class="statusrow"><div><label for="status-'+esc(o.id)+'">Atualizar status</label><select id="status-'+esc(o.id)+'" data-status="'+esc(o.id)+'">'+opts+'</select></div><button data-save="'+esc(o.id)+'">Salvar</button></div></article>'}).join('')||'<div class="card empty">Nenhum pedido corresponde a esse filtro.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>saveStatus(b.dataset.save,b)))}
async function saveStatus(id,button){const select=document.querySelector('[data-status="'+CSS.escape(id)+'"]');const status=select?.value;if(!statuses.includes(status))return;button.disabled=true;button.textContent='Salvando…';const{error}=await db.from('orders').update({status}).eq('id',id);button.disabled=false;button.textContent='Salvar';if(error){notice('Não foi possível atualizar o pedido '+id+': '+error.message,true);return}notice('Status do pedido '+id+' atualizado para “'+status+'”.');await load()}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='Entrando…';const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('message').textContent='Falha no login: '+error.message;return}$('message').textContent='';await show()});
$('refresh').addEventListener('click',()=>{document.title='FeiraJá | Painel de pedidos';load()});$('loadMore').addEventListener('click',loadMore);setInterval(()=>{if(!$('panel').classList.contains('hidden'))load(true)},30000);$('logout').addEventListener('click',async()=>{await db.auth.signOut();setLoggedIn(false)});$('search').addEventListener('input',render);$('filter').addEventListener('change',render);show();
</script></body></html>
