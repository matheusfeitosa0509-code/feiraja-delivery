<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | FeiraJá</title><style>body{font:16px system-ui;margin:0;background:#f3f7f3;color:#193322;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:white;border-radius:14px;padding:20px;margin:14px 0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd8ce;margin:5px 0}input{display:block;width:100%;box-sizing:border-box}button{background:#176b3a;color:white;cursor:pointer}.hidden{display:none}.order{border-top:1px solid #ddd;padding:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="wrap"><h1>🥬 FeiraJá — Pedidos</h1><section id="login" class="card"><h2>Entrar como administrador</h2><form id="form"><label>E-mail<input id="email" type="email" value="Matheusfeitosa0509@gmail.com" required></label><label>Senha do Supabase<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="message"></p></section><section id="panel" class="card hidden"><button id="refresh">Atualizar pedidos</button> <button id="logout">Sair</button><p id="status"></p><div id="orders"></div></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://juhwdevvwstmyxyyagzh.supabase.co','sb_publishable_Hkv-6zE28sUHkhutD3TmGg_JIgOXCAW',{auth:{persistSession:true,autoRefreshToken:true}});
const $=x=>document.getElementById(x),admin='matheusfeitosa0509@gmail.com';
async function show(){const{data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');$('panel').classList.add('hidden');return}if((session.user.email||'').toLowerCase()!==admin){await db.auth.signOut();$('message').textContent='Conta não autorizada.';return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');await load()}
async function load(){ $('status').textContent='Carregando…';$('orders').replaceChildren();const{data,error}=await db.from('orders').select('id,created_at,customer_name,customer_phone,customer_address,customer_email,delivery_type,payment_method,items,subtotal,delivery_fee,total,status').order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent='Erro ao carregar pedidos: '+error.message;return}$('status').textContent=data.length+' pedido(s)';for(const o of data){const a=document.createElement('article');a.className='order';const h=document.createElement('h3');h.textContent='Pedido '+o.id+' — R$ '+Number(o.total||0).toFixed(2).replace('.',',');const p=document.createElement('pre');p.textContent='Status: '+(o.status||'—')+'\nData: '+(o.created_at?new Date(o.created_at).toLocaleString('pt-BR'):'—')+'\nCliente: '+(o.customer_name||'—')+'\nTelefone: '+(o.customer_phone||'—')+'\nE-mail: '+(o.customer_email||'—')+'\nEndereço: '+(o.customer_address||'—')+'\nEntrega: '+(o.delivery_type||'—')+' | Pagamento: '+(o.payment_method||'—')+'\nSubtotal: R$ '+Number(o.subtotal||0).toFixed(2)+' | Frete: R$ '+Number(o.delivery_fee||0).toFixed(2)+'\nItens: '+JSON.stringify(o.items||[],null,2);a.append(h,p);$('orders').append(a)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='Entrando…';const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('message').textContent='Falha no login: '+error.message;return}$('message').textContent='';await show()});$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{await db.auth.signOut();await show()});show();
</script></body></html>
