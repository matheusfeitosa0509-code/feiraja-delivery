name: Asaas webhook routing tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/asaas-webhook/**'
      - '.github/workflows/asaas-webhook-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/asaas-webhook/**'
      - '.github/workflows/asaas-webhook-tests.yml'

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check webhook and routing helpers
        run: deno check supabase/functions/asaas-webhook/index.ts supabase/functions/asaas-webhook/payment-routing.ts
      - name: Test payment routing scenarios
        run: deno test supabase/functions/asaas-webhook/payment-routing_test.ts
