name: Check inline JavaScript syntax # unified product sheet regression
on:
  pull_request:
    paths:
      - "loja.html"
      - "painel.html"
      - "recuperar-senha.html"
      - "supabase/functions/_shared/sales-rules.js"
      - "supabase/functions/super-worker/index.ts"
      - "supabase/migrations/20261114230000_exact_value_sale.sql"
      - "supabase/rollbacks/20261114230000_exact_value_sale_rollback.sql"
      - "supabase/migrations/20261115010000_kg_minimums_and_cost_margin.sql"
      - "supabase/rollbacks/20261115010000_kg_minimums_and_cost_margin_rollback.sql"
      - "supabase/tests/sales-by-value.test.mjs"
      - "supabase/tests/cart-add-render.test.mjs"
      - "supabase/tests/store-cart-fast-value.test.mjs"
      - "supabase/tests/panel-order-value-display.test.mjs"
      - "supabase/migrations/20261114190000_value_sale_for_units_and_panel_defaults.sql"
      - "supabase/rollbacks/20261114190000_value_sale_for_units_and_panel_defaults_rollback.sql"
      - "supabase/tests/unit-value-sale-migration.test.mjs"
      - "supabase/migrations/20261114184851_uva_kg_sale_rule.sql"
      - "supabase/rollbacks/20261114184851_uva_kg_sale_rule_rollback.sql"
      - "supabase/migrations/20261114185150_product_photos_storage.sql"
      - "supabase/rollbacks/20261114185150_product_photos_storage_rollback.sql"
      - "supabase/tests/product-photo-upload-and-uva.test.mjs"
      - "supabase/tests/cart-item-preferences.test.mjs"
      - "supabase/migrations/20261122170000_store_funnel_product_view_pix_generated.sql"
      - "supabase/tests/store-funnel-product-pix.test.mjs"
      - ".github/workflows/check-inline-scripts.yml"
  push:
    branches: [main, feat/product-photo-upload-uva-kg]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run node --check on browser scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const files = ['loja.html', 'painel.html', 'recuperar-senha.html'];
          let index = 0;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
              .map(match => match[1]).filter(script => script.trim());
            if (!scripts.length) throw new Error('No inline scripts found in ' + file);
            for (const script of scripts) {
              const temp = path.join(os.tmpdir(), 'feiraja-' + index++ + '.mjs');
              fs.writeFileSync(temp, script, 'utf8');
              const result = spawnSync(process.execPath, ['--check', temp], { encoding: 'utf8' });
              if (result.status !== 0) {
                process.stderr.write('Syntax error in ' + file + ':\n' + result.stderr);
                process.exit(result.status || 1);
              }
            }
            console.log('node --check OK: ' + file + ' (' + scripts.length + ' script(s))');
          }
          NODE
      - name: Test fallback das colunas de separação
        run: node supabase/tests/order-separation-column-fallback.test.mjs
      - name: Teste da compra por valor exato
        run: node supabase/tests/sales-by-value.test.mjs
      - name: Teste de adicionar ao carrinho sem re-render redundante
        run: node supabase/tests/cart-add-render.test.mjs
      - name: Teste de carrinho rápido e compra por valor nos cards
        run: node supabase/tests/store-cart-fast-value.test.mjs
      - name: Teste de exibição de pedidos por valor na separação
        run: node supabase/tests/panel-order-value-display.test.mjs
      - name: Teste de venda por valor em unidades e compatibilidade do worker
        run: node supabase/tests/unit-value-sale-migration.test.mjs
      - name: Teste de alertas de custo e mínimos por kg
        run: node supabase/tests/panel-cost-alerts.test.mjs
      - name: Teste da ficha única e regras de venda confirmadas
        run: node supabase/tests/unified-product-sheet-and-units.test.mjs
      - name: Teste de envio de fotos e regra da Uva por kg
        run: node supabase/tests/product-photo-upload-and-uva.test.mjs
      - name: Teste de preferências por item no carrinho e repetição do Assistente
        run: node supabase/tests/cart-item-preferences.test.mjs
      - name: Teste dos novos eventos anônimos do funil
        run: node supabase/tests/store-funnel-product-pix.test.mjs
