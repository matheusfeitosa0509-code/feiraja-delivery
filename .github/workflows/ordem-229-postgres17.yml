name: Ordem 229-C - PostgreSQL 17 cancellation tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261111170000_ordem_229_cancelamento_cliente.sql'
      - 'supabase/migrations/20261113140000_admin_order_item_separation.sql'
      - 'supabase/migrations/20261113160000_order_separation_cancel_lock.sql'
      - 'supabase/tests/test_ordem_229_cancelamento.sh'
      - 'supabase/rollback/ordem_229_cancelamento_cliente_rollback.sql'
      - 'supabase/tests/ordem_229_*'
      - '.github/workflows/ordem-229-postgres17.yml'
  push:
    branches: [fix/cancelamento-servidor]
    paths:
      - 'supabase/migrations/20261111170000_ordem_229_cancelamento_cliente.sql'
      - 'supabase/migrations/20261113140000_admin_order_item_separation.sql'
      - 'supabase/migrations/20261113160000_order_separation_cancel_lock.sql'
      - 'supabase/tests/test_ordem_229_cancelamento.sh'
      - 'supabase/rollback/ordem_229_cancelamento_cliente_rollback.sql'
      - 'supabase/tests/ordem_229_*'
      - '.github/workflows/ordem-229-postgres17.yml'
  workflow_dispatch:
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordem_229_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ordem_229_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: ordem_229_test
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript inline de loja.html e painel.html
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          for (const file of ['loja.html', 'painel.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            let checked = 0;
            for (const match of scripts) {
              const attrs = match[1] || '';
              const type = (attrs.match(/\btype\s*=\s*["']([^"']+)["']/i) || [])[1] || '';
              if (type && !/(javascript|module)/i.test(type)) continue;
              if (!match[2].trim()) continue;
              const ext = /module/i.test(type) ? '.mjs' : '.js';
              const temp = path.join(os.tmpdir(), 'inline-check-' + process.pid + '-' + checked + ext);
              fs.writeFileSync(temp, match[2]);
              const result = spawnSync(process.execPath, ['--check', temp], { encoding: 'utf8' });
              fs.unlinkSync(temp);
              if (result.status !== 0) {
                process.stderr.write(result.stderr || result.stdout);
                process.exit(result.status || 1);
              }
              checked++;
            }
            console.log('PASS: ' + file + ' — ' + checked + ' bloco(s) inline verificado(s)');
          }
          NODE
      - name: Test migration, cancellation, notifications and exact rollback
        run: bash supabase/tests/test_ordem_229_cancelamento.sh
