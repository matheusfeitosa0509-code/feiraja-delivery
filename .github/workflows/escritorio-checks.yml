name: Escritório Feira On checks
on:
  pull_request:
    paths:
      - "escritorio/**"
      - "supabase/migrations/*escritorio*"
      - "supabase/rollback/*escritorio*"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser module
        run: node --input-type=module --check < escritorio/app.js
      - name: Validate standalone manifest and isolation
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('escritorio/manifest.webmanifest','utf8'));if(m.name!=='Escritório Feira On'||m.start_url!=='/escritorio/'||m.scope!=='/escritorio/'||m.display!=='standalone')process.exit(1);const h=fs.readFileSync('escritorio/index.html','utf8');if(!h.includes('noindex,nofollow,noarchive')||!h.includes('./app.js'))process.exit(1);"
