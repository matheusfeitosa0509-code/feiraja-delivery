name: Daily recipe kits tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/daily-recipe-kits.js'
      - 'supabase/functions/_shared/daily-recipe-kits.test.mjs'
      - 'supabase/functions/super-worker/index.ts'
      - 'supabase/migrations/20261123193000_daily_recipe_kits.sql'
      - 'supabase/tests/daily-recipe-kits.test.mjs'
      - '.github/workflows/daily-recipe-kits.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/daily-recipe-kits.js'
      - 'supabase/functions/_shared/daily-recipe-kits.test.mjs'
      - 'supabase/functions/super-worker/index.ts'
      - 'supabase/migrations/20261123193000_daily_recipe_kits.sql'
      - 'supabase/tests/daily-recipe-kits.test.mjs'
      - '.github/workflows/daily-recipe-kits.yml'
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test supabase/functions/_shared/daily-recipe-kits.test.mjs supabase/tests/daily-recipe-kits.test.mjs
