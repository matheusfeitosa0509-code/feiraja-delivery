name: Deno Check — Ordem 71

on:
  push:
    branches: [ci/deno-check-order71]

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar versão do Deno
        run: deno --version

      - name: Verificar super-worker e webhook Asaas
        run: deno check supabase/functions/super-worker/index.ts supabase/functions/asaas-webhook/index.ts
