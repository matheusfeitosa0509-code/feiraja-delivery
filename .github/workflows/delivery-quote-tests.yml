name: Delivery quote tests
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/delivery-quote.ts"
      - "supabase/functions/_shared/geocoding.ts"
      - "supabase/functions/_shared/geocoding_test.ts"
      - "supabase/functions/delivery-address/**"
      - "supabase/functions/delivery-quote/**"
      - ".github/workflows/delivery-quote-tests.yml"
  push:
    branches:
      - feat/lalamove-delivery-sandbox
    paths:
      - "supabase/functions/_shared/delivery-quote.ts"
      - "supabase/functions/delivery-quote/**"
      - ".github/workflows/delivery-quote-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-net supabase/functions/delivery-quote/index_test.ts supabase/functions/_shared/geocoding_test.ts supabase/functions/delivery-address/index_test.ts
