name: Delivery quote tests
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/store-schedule.js"
      - "supabase/functions/_shared/store-schedule_test.ts"
      - "supabase/functions/_shared/delivery-quote.ts"
      - "supabase/functions/_shared/geocoding.ts"
      - "supabase/functions/_shared/geocoding_test.ts"
      - "supabase/functions/delivery-address/**"
      - "supabase/functions/super-worker/**"
      - "supabase/functions/assistente/**"
      - "supabase/functions/_shared/item-preferences*"
      - "supabase/tests/cart-item-preferences.test.mjs"
      - "supabase/functions/delivery-quote/**"
      - "supabase/functions/lalamove-dispatch/**"
      - "supabase/functions/lalamove-webhook/**"
      - "supabase/functions/_shared/lalamove-dispatch.ts"
      - "supabase/functions/_shared/lalamove-environment.ts"
      - "supabase/functions/_shared/lalamove-environment_test.ts"
      - "supabase/functions/lalamove-tracking/**"
      - "supabase/functions/_shared/lalamove-tracking.ts"
      - "supabase/migrations/*lalamove-tracking*.sql"
      - "supabase/migrations/*grant_lalamove_environment_admin_access.sql"
      - "supabase/tests/panel-order-value-display.test.mjs"
      - "supabase/rollback/*lalamove-tracking*.sql"
      - "lalamove-map.js"
      - "tests/order-tracking.visual.cjs"
      - "tests/checkout-delivery-access.visual.cjs"
      - "tests/legal-identity.visual.cjs"
      - "termos.html"
      - "politica-privacidade.html"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-functions.yml"
      - "supabase/migrations/*lalamove-dispatch-and-webhook.sql"
      - "supabase/migrations/*lalamove-production-environment.sql"
      - "supabase/rollback/*lalamove-production-environment.sql"
      - "painel.html"
      - "tests/painel-compact.visual.cjs"
      - "tests/lalamove-panel.visual.cjs"
      - "tests/painel-full-html-lalamove.visual.cjs"
      - "tests/loja-console-errors.visual.cjs"
      - "tests/cart-modernization.visual.cjs"
      - "loja.html"
      - "sw.js"
      - "tests/storefront-performance.visual.cjs"
      - "loja-delivery-ui.js"
      - "loja-delivery-ui_test.ts"
      - "tests/scheduled-delivery.visual.cjs"
      - "tests/checkout-delivery-address.visual.cjs"
      - "tests/painel-product-create.visual.cjs"
      - ".github/workflows/delivery-quote-tests.yml"
  push:
    branches:
      - main
      - fix/lalamove-dispatch-compact-panel
      - feat/lalamove-delivery-sandbox
      - feat/lalamove-delivery-stage-3
      - feat/checkout-order-tracking-map
    paths:
      - "supabase/functions/super-worker/**"
      - "supabase/functions/assistente/**"
      - "supabase/functions/_shared/item-preferences*"
      - "supabase/tests/cart-item-preferences.test.mjs"
      - "supabase/functions/_shared/delivery-quote.ts"
      - "supabase/functions/delivery-quote/**"
      - "supabase/functions/lalamove-dispatch/**"
      - "supabase/functions/lalamove-webhook/**"
      - "supabase/functions/_shared/lalamove-dispatch.ts"
      - "supabase/functions/lalamove-tracking/**"
      - "supabase/functions/_shared/lalamove-tracking.ts"
      - "supabase/migrations/*lalamove-tracking*.sql"
      - "supabase/rollback/*lalamove-tracking*.sql"
      - "lalamove-map.js"
      - "tests/order-tracking.visual.cjs"
      - "tests/checkout-delivery-access.visual.cjs"
      - "painel.html"
      - "loja.html"
      - "loja-delivery-ui.js"
      - "loja-delivery-ui_test.ts"
      - "tests/painel-compact.visual.cjs"
      - "tests/painel-full-html-lalamove.visual.cjs"
      - "tests/loja-console-errors.visual.cjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-functions.yml"
      - ".github/workflows/delivery-quote-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip for Deno setup
        run: apt-get update && apt-get install -y unzip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/delivery-address/deno.json supabase/functions/delivery-address/index.ts
      - run: deno check --config supabase/functions/delivery-quote/deno.json supabase/functions/delivery-quote/index.ts
      - run: deno check --config supabase/functions/lalamove-dispatch/deno.json supabase/functions/lalamove-dispatch/index.ts
      - run: deno check --config supabase/functions/lalamove-webhook/deno.json supabase/functions/lalamove-webhook/index.ts
      - run: deno check --config supabase/functions/lalamove-tracking/deno.json supabase/functions/lalamove-tracking/index.ts
      - run: deno test --allow-net --allow-read supabase/functions/delivery-quote/index_test.ts supabase/functions/_shared/geocoding_test.ts supabase/functions/delivery-address/index_test.ts supabase/functions/lalamove-dispatch/index_test.ts supabase/functions/lalamove-tracking/index_test.ts supabase/functions/_shared/lalamove-environment_test.ts
      - run: deno test --allow-read loja-delivery-ui_test.ts supabase/functions/_shared/store-schedule_test.ts
      - run: deno test --allow-read supabase/functions/super-worker/delivery-order_test.ts supabase/functions/_shared/item-preferences_test.ts
      - run: node supabase/tests/cart-item-preferences.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/playwright playwright@1.58.2
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/painel-product-create.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/painel-compact.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/lalamove-panel.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/painel-full-html-lalamove.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/checkout-delivery-address.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/loja-console-errors.visual.cjs
      # Captures production baseline and branch timings on simulated 4G at 360px/412px.
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/storefront-performance.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/cart-modernization.visual.cjs
      - run: node supabase/tests/panel-order-value-display.test.mjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/order-tracking.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/checkout-delivery-access.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/scheduled-delivery.visual.cjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/legal-identity.visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painel-mobile-playwright-screenshots
          path: artifacts/painel-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-tracking-mobile-screenshots-and-video
          path: |
            artifacts/order-tracking-*.png
            artifacts/order-tracking-*.webm
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-delivery-admin-playwright
          path: artifacts/checkout-delivery-admin-*.png
          if-no-files-found: warn
