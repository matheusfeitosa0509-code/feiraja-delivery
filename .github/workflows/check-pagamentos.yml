name: Check Pagamentos (Deno)

on:
  pull_request:
    paths:
      - "supabase/functions/asaas-webhook/**"
      - "supabase/functions/super-worker/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/expire-pix/**"
      - "supabase/functions/asaas-saque-validacao/**"
      - ".github/workflows/check-pagamentos.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/asaas-webhook/**"
      - "supabase/functions/super-worker/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/expire-pix/**"
      - "supabase/functions/asaas-saque-validacao/**"
      - ".github/workflows/check-pagamentos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    name: deno check pagamentos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Asaas webhook
        run: deno check supabase/functions/asaas-webhook/index.ts

      - name: Check super-worker
        run: deno check supabase/functions/super-worker/index.ts

      - name: Test Mercado Pago cancelled-order handling
        run: deno test supabase/functions/super-worker/payment-status_test.ts

      - name: Check expire-pix
        run: deno check supabase/functions/expire-pix/index.ts

      - name: Check Asaas saque validation
        run: deno check supabase/functions/asaas-saque-validacao/index.ts
