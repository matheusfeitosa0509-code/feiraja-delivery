name: Panel product creation tests
on:
  pull_request:
    paths:
      - "painel.html"
      - "cadastro-produto.html"
      - "tests/painel-product-create.visual.cjs"
      - "tests/round3-finance-products.test.mjs"
      - "supabase/migrations/**"
      - "supabase/rollbacks/**"
      - "supabase/functions/super-worker/**"
  push:
    branches:
      - main
    paths:
      - "painel.html"
      - "cadastro-produto.html"
      - "tests/painel-product-create.visual.cjs"
      - "tests/round3-finance-products.test.mjs"
      - "supabase/migrations/**"
      - "supabase/rollbacks/**"
      - "supabase/functions/super-worker/**"
      - ".github/workflows/panel-product-create-tests.yml"
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/playwright playwright@1.58.2
      - run: /tmp/playwright/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/round3-finance-products.test.mjs
      - run: NODE_PATH=/tmp/playwright/node_modules node tests/painel-product-create.visual.cjs
