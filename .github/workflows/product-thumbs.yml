name: Generate product photo thumbnails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente listar o que seria gerado (marque false para enviar)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: product-photo-thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned image processor
        run: npm install --no-save sharp@0.34.5
      - name: List and generate missing WebP thumbnails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/generate-product-thumbs.mjs
