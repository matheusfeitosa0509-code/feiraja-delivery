name: Deploy Supabase Edge Function

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Função que será implantada"
        required: true
        type: choice
        options:
          - super-worker
          - asaas-webhook
          - asaas-saque-validacao
          - expire-pix
      ref:
        description: "SHA completo de commit alcançável por main (vazio = commit atual de main)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: juhwdevvwstmyxyyagzh
      FUNCTION_NAME: ${{ inputs.function }}
      REQUESTED_REF: ${{ inputs.ref }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validar função e commit solicitado
        shell: bash
        run: |
          set -euo pipefail

          case "$FUNCTION_NAME" in
            super-worker|asaas-webhook|asaas-saque-validacao|expire-pix) ;;
            *)
              echo "::error::Função não permitida."
              exit 1
              ;;
          esac

          if [[ -z "$REQUESTED_REF" ]]; then
            TARGET_REF="$(git rev-parse HEAD)"
          else
            if [[ ! "$REQUESTED_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::ref deve ser um SHA completo de 40 caracteres."
              exit 1
            fi

            TARGET_REF="$(git rev-parse --verify "${REQUESTED_REF}^{commit}")"

            if ! git merge-base --is-ancestor "$TARGET_REF" origin/main; then
              echo "::error::O commit não pertence à história alcançável de main."
              exit 1
            fi
          fi

          echo "TARGET_REF=$TARGET_REF" >> "$GITHUB_ENV"

      - name: Selecionar código do commit validado
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$TARGET_REF"
          echo "Commit selecionado: $(git rev-parse HEAD)"

      - name: Instalar Supabase CLI fixo
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2

      - name: Conferir versão do CLI
        run: supabase --version

      - name: Implantar super-worker
        if: inputs.function == 'super-worker'
        run: |
          supabase functions deploy super-worker \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Implantar asaas-webhook
        if: inputs.function == 'asaas-webhook'
        run: |
          supabase functions deploy asaas-webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Implantar asaas-saque-validacao
        if: inputs.function == 'asaas-saque-validacao'
        run: |
          supabase functions deploy asaas-saque-validacao \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Implantar expire-pix
        if: inputs.function == 'expire-pix'
        run: |
          supabase functions deploy expire-pix \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Registrar SHA implantado
        if: success()
        run: |
          echo "Função implantada: $FUNCTION_NAME"
          echo "SHA do código implantado: $(git rev-parse HEAD)"
