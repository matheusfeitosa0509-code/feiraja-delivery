name: First delivery promo server A1 PostgreSQL tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261121140000_first_delivery_promo_server_a1.sql'
      - 'supabase/migrations/20261122145825_first_delivery_promo_ui_a2.sql'
      - 'supabase/migrations/20261122210000_first_delivery_promo_preview_a3.sql'
      - 'supabase/tests/first_delivery_promo_*'
      - 'supabase/tests/first-delivery-promo-preview.test.mjs'
      - 'supabase/functions/super-worker/index.ts'
      - '.github/workflows/first-delivery-promo-a1.yml'
  push:
    branches: [feat/first-delivery-promo-server-a1]
    paths:
      - 'supabase/migrations/20261121140000_first_delivery_promo_server_a1.sql'
      - 'supabase/tests/first_delivery_promo_*'
      - 'supabase/functions/super-worker/index.ts'
      - '.github/workflows/first-delivery-promo-a1.yml'
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promo_a1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d promo_a1_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Testes transacionais e concorrência
        run: bash supabase/tests/first_delivery_promo_test.sh
      - name: Teste de apresentação da prévia no checkout
        run: node supabase/tests/first-delivery-promo-preview.test.mjs
