name: Deploy FeiraJa to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site-only artifact
        run: |
          mkdir -p _site/previa
          cp -a ./*.html ./turnstile.js ./icons ./imagens ./previa ./manifest.json ./sw.js _site/
          cp ./index.html _site/previa/index.html
          sed -i 's#src="./imagens/166159-removebg-preview.png"#src="../imagens/166159-removebg-preview.png"#' _site/previa/index.html
          cp ./recuperar-senha.html _site/previa/recuperar-senha.html
          rm -f _site/imagens/produtos/leia.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
