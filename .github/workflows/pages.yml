name: Deploy FeiraJa to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image optimizer
        run: npm install --no-save sharp
      - name: Prepare site-only artifact
        run: |
          mkdir -p _site
          cp -a ./index.html ./admin.html ./cadastro-produto.html ./painel.html ./clientes-vendas.html ./loja.html ./loja-delivery-ui.js ./lalamove-map.js ./assistant-runtime.js ./assistant-speech.js ./politica-privacidade.html ./recuperar-senha.html ./termos.html ./turnstile.js ./icons ./imagens ./manifest.json ./manifest-painel.json ./sw.js ./ig ./stories ./zap ./panfleto ./panfleto1 ./panfleto2 ./panfleto3 ./escritorio _site/
          mkdir -p _site/supabase/functions/_shared
          cp supabase/functions/_shared/store-schedule.js _site/supabase/functions/_shared/store-schedule.js
          cp supabase/functions/_shared/commercial-calendar.js _site/supabase/functions/_shared/commercial-calendar.js
          cp supabase/functions/_shared/store-banner-schedule.js _site/supabase/functions/_shared/store-banner-schedule.js
          rm -f _site/imagens/produtos/leia.txt
          node scripts/optimize-store-images.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Playwright Chromium for post-deploy smoke test
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify main storefront actions on published site
        env:
          PAGES_BASE_URL: https://www.feiraondelivery.com.br
        run: node tests/post-deploy-storefront-actions.cjs
      - name: Verify published storefront and panel
        env:
          PAGES_BASE_URL: https://www.feiraondelivery.com.br
        run: node tests/post-deploy-pages.cjs
