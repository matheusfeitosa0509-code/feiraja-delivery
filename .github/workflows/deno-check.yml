name: Deno check (Order 83)

on:
  push:
    branches:
      - ci/deno-check-order83

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno version
        run: deno --version
      - name: Type-check Supabase functions
        run: deno check supabase/functions/super-worker/index.ts supabase/functions/asaas-webhook/index.ts
