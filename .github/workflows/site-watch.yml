name: Vigia do site real

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-site-watch:
    name: Playwright • site real • 360px e 412px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Test customer delivery status and timeline at 360px/412px
        run: node tests/order-tracking-display.visual.cjs
      - name: Validate store banner manager and database policies
        run: node tests/store-banners-manager.test.cjs
      - name: Test dynamic storefront banners at 360px/412px
        run: node tests/storefront-banners.visual.cjs
      - name: Test Pix generation wait and duplicate-submit protection
        run: node tests/pix-generation-wait.test.mjs
      - name: Test Pix wait sheet at 360px and 412px
        run: node tests/pix-generation-wait.visual.cjs
      - name: Test stale order alert thresholds, resolution and deduplication
        run: node --test tests/order-stale-alerts.test.mjs
      - name: Run vigia against production
        run: npx playwright test tests/site-watch.spec.js --reporter=list
      - name: Verify health-check rejects requests without token
        run: |
          status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://juhwdevvwstmyxyyagzh.supabase.co/functions/v1/health-check")" || {
            echo "::error::health-check indisponível para teste sem token."
            exit 1
          }
          if [ "$status" != "401" ]; then
            echo "::error::Esperado HTTP 401 sem x-health-token; recebido HTTP $status."
            exit 1
          fi
          echo "PASSOU | autenticação | HTTP 401 sem x-health-token."
      - name: Run server health-check
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          if [ -z "$HEALTH_TOKEN" ]; then
            echo "::error::GitHub secret HEALTH_TOKEN ausente."
            exit 1
          fi
          response="$(curl -sS --max-time 90 -H "x-health-token: $HEALTH_TOKEN" "https://juhwdevvwstmyxyyagzh.supabase.co/functions/v1/health-check")" || {
            echo "::error::health-check indisponível ou sem resposta HTTP."
            exit 1
          }
          printf '%s' "$response" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let data;
              try { data = JSON.parse(raw); } catch {
                console.error("health-check: resposta JSON inválida");
                process.exit(1);
              }
              for (const check of (data.checks || [])) {
                console.log((check.ok ? "PASSOU" : "FALHOU") + " | " + check.item + " | " + check.message);
              }
              if (data.ok !== true || !Array.isArray(data.checks) || data.checks.some(check => check.ok !== true)) {
                console.error("health-check: um ou mais exames falharam.");
                process.exit(1);
              }
            });
          '
      - name: PageSpeed Insights — baseline antes do banner com imagem
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.number == 400
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const {chromium} = require('playwright');
          const base = 'https://matheusfeitosa0509-code.github.io/feiraja-delivery/loja.html';
          const median = values => [...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
          async function run(strategy) {
            const scores = [];
            for (let attempt=1; attempt<=3; attempt++) {
              const output = '/tmp/lighthouse-baseline-' + strategy + '-' + attempt + '.json';
              const args = ['--yes','lighthouse@12.8.2',base,'--only-categories=performance','--output=json','--output-path='+output,'--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage'];
              if (strategy === 'desktop') args.push('--preset=desktop');
              execFileSync('npx',args,{stdio:'inherit',env:{...process.env,CHROME_PATH:chromium.executablePath()}});
              const data = JSON.parse(fs.readFileSync(output,'utf8'));
              const score = Math.round((data.categories?.performance?.score ?? 0) * 100);
              if (!score) throw new Error('Lighthouse não retornou nota de performance.');
              scores.push(score);
            }
            const result = median(scores);
            console.log('PAGESPEED_BASELINE_' + strategy.toUpperCase() + '=' + result + ' [mediana de 3 Lighthouse CLI]');
            console.log('PAGESPEED_BASELINE_' + strategy.toUpperCase() + '_RUNS=' + scores.join(','));
          }
          (async()=>{await run('mobile');await run('desktop');})().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: PageSpeed Insights — conferir nota após publicar banners com imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'store banners')
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const {chromium} = require('playwright');
          const base = 'https://matheusfeitosa0509-code.github.io/feiraja-delivery/loja.html';
          const median = values => [...values].sort((a,b)=>a-b)[Math.floor(values.length/2)];
          (async()=>{
            let published = false;
            for (let attempt=0; attempt<36; attempt++) {
              const response = await fetch(base + '?deploy_probe=' + process.env.GITHUB_SHA, {cache:'no-store'});
              const html = response.ok ? await response.text() : '';
              if (html.includes('store-banner-image')) { published = true; break; }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            if (!published) throw new Error('A publicação do GitHub Pages não apareceu em até 6 minutos; medição pós-publicação não foi executada.');
            const scores = [];
            for (let attempt=1; attempt<=3; attempt++) {
              const output = '/tmp/lighthouse-after-mobile-' + attempt + '.json';
              const args = ['--yes','lighthouse@12.8.2',base,'--only-categories=performance','--output=json','--output-path='+output,'--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage'];
              execFileSync('npx',args,{stdio:'inherit',env:{...process.env,CHROME_PATH:chromium.executablePath()}});
              const data = JSON.parse(fs.readFileSync(output,'utf8'));
              const score = Math.round((data.categories?.performance?.score ?? 0) * 100);
              if (!score) throw new Error('Lighthouse não retornou nota mobile.');
              scores.push(score);
            }
            const result = median(scores);
            console.log('PAGESPEED_AFTER_MOBILE=' + result + ' [mediana de 3 Lighthouse CLI]');
            console.log('PAGESPEED_AFTER_MOBILE_RUNS=' + scores.join(','));
            if (result < 61) throw new Error('Nota mobile pós-publicação caiu mais de 3 pontos em relação ao baseline local mobile 64.');
            const desktopScores = [];
            for (let attempt=1; attempt<=3; attempt++) {
              const output = '/tmp/lighthouse-after-desktop-' + attempt + '.json';
              const args = ['--yes','lighthouse@12.8.2',base,'--only-categories=performance','--output=json','--output-path='+output,'--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage','--preset=desktop'];
              execFileSync('npx',args,{stdio:'inherit',env:{...process.env,CHROME_PATH:chromium.executablePath()}});
              const desktop = JSON.parse(fs.readFileSync(output,'utf8'));
              const score = Math.round((desktop.categories?.performance?.score ?? 0) * 100);
              if (!score) throw new Error('Lighthouse não retornou nota desktop.');
              desktopScores.push(score);
            }
            console.log('PAGESPEED_AFTER_DESKTOP=' + median(desktopScores) + ' [mediana de 3 Lighthouse CLI]');
            console.log('PAGESPEED_AFTER_DESKTOP_RUNS=' + desktopScores.join(','));
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Upload display screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-tracking-display-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-watch-playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
