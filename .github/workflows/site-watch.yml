name: Vigia do site real

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-site-watch:
    name: Playwright • site real • 360px e 412px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Run vigia against production
        run: npx playwright test tests/site-watch.spec.js --reporter=list
      - name: Run server health-check
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          if [ -z "$HEALTH_TOKEN" ]; then
            echo "::error::GitHub secret HEALTH_TOKEN ausente."
            exit 1
          fi
          response="$(curl -sS --max-time 90 -H "x-health-token: $HEALTH_TOKEN" "https://juhwdevvwstmyxyyagzh.supabase.co/functions/v1/health-check")" || {
            echo "::error::health-check indisponível ou sem resposta HTTP."
            exit 1
          }
          printf '%s' "$response" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let data;
              try { data = JSON.parse(raw); } catch {
                console.error("health-check: resposta JSON inválida");
                process.exit(1);
              }
              for (const check of (data.checks || [])) {
                console.log((check.ok ? "PASSOU" : "FALHOU") + " | " + check.item + " | " + check.message);
              }
              if (data.ok !== true || !Array.isArray(data.checks) || data.checks.some(check => check.ok !== true)) {
                console.error("health-check: um ou mais exames falharam.");
                process.exit(1);
              }
            });
          '
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-watch-playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
