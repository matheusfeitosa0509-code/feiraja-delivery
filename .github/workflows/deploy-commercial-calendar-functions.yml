name: Deploy shared commercial calendar functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/commercial-calendar.js"
      - "supabase/functions/super-worker/**"
      - "supabase/functions/delivery-quote/**"
      - "supabase/functions/assistente/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: juhwdevvwstmyxyyagzh
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.84.2
      - name: Check CLI version
        run: supabase --version
      - name: Deploy super-worker
        run: |
          supabase functions deploy super-worker \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
      - name: Deploy delivery-quote
        run: |
          supabase functions deploy delivery-quote \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy assistente
        run: |
          supabase functions deploy assistente \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Report deployed commit
        run: |
          echo "Commercial calendar functions deployed from $(git rev-parse HEAD)"
