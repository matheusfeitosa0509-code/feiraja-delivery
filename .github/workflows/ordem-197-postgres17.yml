name: Ordem 197 - PostgreSQL 17 pickup migration tests
on:
  pull_request:
    branches: [feat/ordem-191-retirada-only, main]
    paths:
      - 'supabase/tests/**'
      - 'supabase/migrations/20261110020000_ordem_191_pickup_only.sql'
      - 'supabase/migrations/20261113010000_checkout_idempotency.sql'
      - '.github/workflows/ordem-197-postgres17.yml'
  push:
    branches: [feat/ordem-191-retirada-only, main]
    paths:
      - 'supabase/tests/minimal_schema.sql'
      - 'supabase/tests/test_rollback_191.sh'
      - 'supabase/migrations/20261110020000_ordem_191_pickup_only.sql'
      - 'supabase/migrations/20261113010000_checkout_idempotency.sql'
      - '.github/workflows/ordem-197-postgres17.yml'
  workflow_dispatch:
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pickup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pickup_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pickup_test
    steps:
      - uses: actions/checkout@v7
      - name: Apply minimal test schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/minimal_schema.sql
      - name: Apply only Ordem 191 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110020000_ordem_191_pickup_only.sql
      - name: Assert schema, function bodies, constraints and pickup behavior
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE d text; n int;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='orders' AND column_name='pickup_code') THEN RAISE EXCEPTION 'FAIL pickup_code column'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='orders_pickup_code_format_check') THEN RAISE EXCEPTION 'FAIL pickup constraint'; END IF;
            SELECT pg_get_functiondef('public.create_order_with_rate_limit(jsonb)'::regprocedure) INTO d;
            IF position('pickup_code' IN d)=0 THEN RAISE EXCEPTION 'FAIL function 1 body'; END IF;
            SELECT pg_get_functiondef('public.push_orders_notify()'::regprocedure) INTO d;
            IF position('Dinheiro na retirada' IN d)=0 OR position('Cartão na retirada' IN d)=0 OR position('Dinheiro na entrega' IN d)=0 OR position('Cartão na entrega' IN d)=0 THEN RAISE EXCEPTION 'FAIL function 2 body'; END IF;
            SELECT count(*) INTO n FROM pg_constraint WHERE conrelid='public.orders'::regclass AND conname IN ('orders_items_positive_quantity_check','orders_text_lengths_check','orders_pickup_code_format_check');
            IF n<>3 THEN RAISE EXCEPTION 'FAIL expected 3 order checks, got %',n; END IF;
            RAISE NOTICE 'PASS: orders_items_positive_quantity_check and orders_text_lengths_check present';
            RAISE NOTICE 'NOT COVERED: products_price_positive_check; customer_profiles_text_lengths_check';
          END $$;
          INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code)
          VALUES ('legacy','Cliente','11999999999','Endereço antigo','delivery','pix','[{"qty":1}]',10,5,15,'Pagamento Pendente','{}',NULL);
          INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code)
          VALUES ('uber-ok','Cliente','11999999999','Retirada na loja','pickup_uber','Dinheiro na retirada','[{"qty":1}]',10,0,10,'Pedido Recebido','{}','0042');
          DO $$
          BEGIN
            BEGIN INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code) VALUES ('uber-null','C','1','R','pickup_uber','pix','[{"qty":1}]',1,0,1,'x','{}',NULL); RAISE EXCEPTION 'FAIL expected null code rejection'; EXCEPTION WHEN check_violation THEN NULL; END;
            BEGIN INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code) VALUES ('uber-3','C','1','R','pickup_uber','pix','[{"qty":1}]',1,0,1,'x','{}','123'); RAISE EXCEPTION 'FAIL expected 3 digit rejection'; EXCEPTION WHEN check_violation THEN NULL; END;
            BEGIN INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code) VALUES ('uber-alpha','C','1','R','pickup_uber','pix','[{"qty":1}]',1,0,1,'x','{}','12AB'); RAISE EXCEPTION 'FAIL expected alpha rejection'; EXCEPTION WHEN check_violation THEN NULL; END;
            BEGIN INSERT INTO public.orders(id,customer_name,customer_phone,customer_address,delivery_type,payment_method,items,subtotal,delivery_fee,total,status,market_checklist,pickup_code) VALUES ('store-code','C','1','R','pickup_store','pix','[{"qty":1}]',1,0,1,'x','{}','1234'); RAISE EXCEPTION 'FAIL expected store code rejection'; EXCEPTION WHEN check_violation THEN NULL; END;
          END $$;
          SELECT 'PASS: legacy delivery with null code' AS test;
          SELECT 'PASS: pickup_uber with 4 digits' AS test;
          SELECT 'PASS: invalid pickup codes rejected' AS test;
          SELECT 'PASS: pickup_store with code rejected' AS test;
          SQL
      - name: Test four intentional replace failures and transactional rollback
        run: bash supabase/tests/test_replace_failures.sh
      - name: Test order RPC for both pickup types
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT * FROM public.create_order_with_rate_limit('{"id":"rpc-store","user_id":"11111111-1111-1111-1111-111111111111","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada na loja","delivery_type":"pickup_store","payment_method":"Dinheiro na retirada","payment_provider":null,"items":[{"qty":1}],"subtotal":10,"delivery_fee":0,"total":10,"status":"Pedido Recebido","market_checklist":{}}'::jsonb);
          SELECT * FROM public.create_order_with_rate_limit('{"id":"rpc-uber","user_id":"22222222-2222-2222-2222-222222222222","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada na loja","delivery_type":"pickup_uber","pickup_code":"0042","payment_method":"Cartão na retirada","payment_provider":null,"items":[{"qty":1}],"subtotal":10,"delivery_fee":0,"total":10,"status":"Pedido Recebido","market_checklist":{}}'::jsonb);
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM public.orders WHERE id='rpc-store' AND pickup_code IS NULL AND customer_address='Retirada na loja') THEN RAISE EXCEPTION 'FAIL RPC pickup_store'; END IF;
            IF NOT EXISTS(SELECT 1 FROM public.orders WHERE id='rpc-uber' AND pickup_code='0042' AND customer_address='Retirada na loja') THEN RAISE EXCEPTION 'FAIL RPC pickup_uber'; END IF;
          END $$;
          SELECT 'PASS: RPC pickup_store' AS test;
          SELECT 'PASS: RPC pickup_uber preserves leading zero' AS test;
          SQL
      - name: Test Ordem 191 rollback scenarios A-D
        run: bash supabase/tests/test_rollback_191.sh
      - name: Prepare auth.users stub and apply checkout idempotency migration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          INSERT INTO auth.users(id) VALUES
            ('11111111-1111-4111-8111-111111111111'),
            ('22222222-2222-4222-8222-222222222222'),
            ('33333333-3333-4333-8333-333333333333');
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113010000_checkout_idempotency.sql
      - name: Test v52 legacy path, idempotency, conflict, rate limit and payment claim
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- v52 compatibility: no key and no hash still creates one order.
          SELECT * FROM public.create_order_with_rate_limit('{"id":"legacy-v52","user_id":"11111111-1111-4111-8111-111111111111","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada","delivery_type":"pickup_uber","pickup_code":"0042","payment_method":"pix","payment_provider":null,"items":[{"qty":1}],"subtotal":30,"delivery_fee":0,"total":30,"status":"Pagamento Pendente","market_checklist":{"legacy":true}}'::jsonb);
          DO $ordemh$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.orders WHERE id='legacy-v52' AND pickup_code='0042' AND market_checklist='{"legacy":true}'::jsonb) THEN RAISE EXCEPTION 'FAIL legacy pickup_code/market_checklist'; END IF;
          END $ordemh$;
          -- Same key + same hash returns exactly the same order; it does not insert a second.
          SELECT * FROM public.create_order_with_rate_limit('{"id":"idem-first","user_id":"22222222-2222-4222-8222-222222222222","checkout_idempotency_key":"00000000-0000-4000-8000-000000000001","checkout_request_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada","delivery_type":"pickup_uber","pickup_code":"1234","payment_method":"Asaas Pix","payment_provider":"asaas","items":[{"qty":1}],"subtotal":30,"delivery_fee":0,"total":30,"status":"Pagamento Pendente","market_checklist":{"idempotent":true}}'::jsonb);
          SELECT * FROM public.create_order_with_rate_limit('{"id":"idem-second-should-not-exist","user_id":"22222222-2222-4222-8222-222222222222","checkout_idempotency_key":"00000000-0000-4000-8000-000000000001","checkout_request_hash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada","delivery_type":"pickup_uber","pickup_code":"1234","payment_method":"Asaas Pix","payment_provider":"asaas","items":[{"qty":1}],"subtotal":30,"delivery_fee":0,"total":30,"status":"Pagamento Pendente","market_checklist":{"idempotent":true}}'::jsonb);
          DO $ordemh$ BEGIN
            IF (SELECT count(*) FROM public.orders WHERE user_id='22222222-2222-4222-8222-222222222222') <> 1 THEN RAISE EXCEPTION 'FAIL duplicate order created'; END IF;
            IF NOT EXISTS (SELECT 1 FROM public.orders WHERE id='idem-first' AND pickup_code='1234' AND market_checklist='{"idempotent":true}'::jsonb) THEN RAISE EXCEPTION 'FAIL idempotent fields not preserved'; END IF;
            IF NOT EXISTS (SELECT 1 FROM public.checkout_idempotency WHERE idempotency_key='00000000-0000-4000-8000-000000000001' AND order_id='idem-first') THEN RAISE EXCEPTION 'FAIL idempotency mapping'; END IF;
          END $ordemh$;
          -- Same key with a different hash must be rejected.
          DO $ordemh$ BEGIN
            BEGIN
              PERFORM * FROM public.create_order_with_rate_limit('{"id":"idem-conflict","user_id":"22222222-2222-4222-8222-222222222222","checkout_idempotency_key":"00000000-0000-4000-8000-000000000001","checkout_request_hash":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","customer_name":"Cliente","customer_phone":"11999999999","customer_address":"Retirada","delivery_type":"pickup_uber","pickup_code":"1234","payment_method":"Asaas Pix","payment_provider":"asaas","items":[{"qty":1}],"subtotal":30,"delivery_fee":0,"total":30,"status":"Pagamento Pendente","market_checklist":{}}'::jsonb);
              RAISE EXCEPTION 'FAIL expected idempotency conflict';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $ordemh$;
          -- First claim is true; a repeated claim while lock is active is false.
          DO $ordemh$ DECLARE first_claim record; second_claim record;
          BEGIN
            SELECT * INTO first_claim FROM public.claim_checkout_payment('00000000-0000-4000-8000-000000000001','22222222-2222-4222-8222-222222222222');
            SELECT * INTO second_claim FROM public.claim_checkout_payment('00000000-0000-4000-8000-000000000001','22222222-2222-4222-8222-222222222222');
            IF first_claim.claimed IS DISTINCT FROM true OR first_claim.order_id <> 'idem-first' THEN RAISE EXCEPTION 'FAIL first payment claim'; END IF;
            IF second_claim.claimed IS DISTINCT FROM false OR second_claim.order_id <> 'idem-first' THEN RAISE EXCEPTION 'FAIL second payment claim'; END IF;
          END $ordemh$;
          -- Five orders are allowed in ten minutes; the sixth is rejected.
          DO $ordemh$ DECLARE i int; payload jsonb;
          BEGIN
            FOR i IN 1..5 LOOP
              payload := jsonb_build_object('id','rate-'||i,'user_id','33333333-3333-4333-8333-333333333333','customer_name','Cliente','customer_phone','11999999999','customer_address','Retirada','delivery_type','pickup_store','payment_method','Dinheiro na retirada','items',jsonb_build_array(jsonb_build_object('qty',1)),'subtotal',30,'delivery_fee',0,'total',30,'status','Pedido Recebido','market_checklist',jsonb_build_object('n',i));
              PERFORM * FROM public.create_order_with_rate_limit(payload);
            END LOOP;
            payload := jsonb_build_object('id','rate-6','user_id','33333333-3333-4333-8333-333333333333','customer_name','Cliente','customer_phone','11999999999','customer_address','Retirada','delivery_type','pickup_store','payment_method','Dinheiro na retirada','items',jsonb_build_array(jsonb_build_object('qty',1)),'subtotal',30,'delivery_fee',0,'total',30,'status','Pedido Recebido','market_checklist','{}'::jsonb);
            BEGIN
              PERFORM * FROM public.create_order_with_rate_limit(payload);
              RAISE EXCEPTION 'FAIL expected rate limit';
            EXCEPTION WHEN SQLSTATE 'P0001' THEN NULL;
            END;
            IF (SELECT count(*) FROM public.orders WHERE user_id='33333333-3333-4333-8333-333333333333') <> 5 THEN RAISE EXCEPTION 'FAIL rate limit count'; END IF;
          END $ordemh$;
          SELECT 'PASS: v52 legacy path and pickup fields' AS test;
          SELECT 'PASS: repeated key returns same order' AS test;
          SELECT 'PASS: changed hash rejected' AS test;
          SELECT 'PASS: five orders allowed, sixth rejected' AS test;
          SELECT 'PASS: payment claim true then false' AS test;
          SQL
